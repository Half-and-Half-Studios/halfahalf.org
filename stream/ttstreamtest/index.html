<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grid"></div>
  <div class="scanbar"></div>

  <main class="center">
    <h1 class="title">Stream Test</h1>
    <p class="clock" id="clock">00:00:00.000</p>
  </main>

  <footer class="hud">
    <span id="fps">FPS: --</span>
    <span id="res">-- x --</span>
    <span class="hint">Click or press F for fullscreen</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
